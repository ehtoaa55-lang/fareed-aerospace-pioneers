<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة قائد فريق FAP</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --fap-navy: #0b2c5d;
      --fap-blue: #154c9e;
      --fap-gold: #d4af37;
      --fap-gold-light: #f5dc86;
      --fap-white: #ffffff;
      --fap-bg: #eef3fa;
      --fap-text: #111827;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: var(--fap-bg);
      color: var(--fap-text);
      padding: 24px;
    }

    .dashboard-container {
      max-width: 960px;
      margin: 0 auto;
    }

    .dashboard-header {
      background: linear-gradient(90deg, var(--fap-navy) 0%, var(--fap-blue) 100%);
      color: var(--fap-white);
      padding: 20px 24px;
      border-radius: 16px;
      border-bottom: 4px solid var(--fap-gold);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .dashboard-header h1 {
      font-size: 22px;
      font-weight: 800;
    }

    .dashboard-header p {
      font-size: 14px;
      opacity: 0.92;
    }

    .requests-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .request-card {
      background: var(--fap-white);
      border-radius: 14px;
      padding: 18px 20px;
      border: 1px solid #d5e0f0;
      border-right: 5px solid var(--fap-blue);
      box-shadow: 0 6px 18px rgba(11, 44, 93, 0.06);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .request-info h2 {
      font-size: 18px;
      font-weight: 800;
      color: var(--fap-navy);
      margin-bottom: 6px;
    }

    .request-meta {
      font-size: 14px;
      color: #374151;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #e0ecff;
      color: var(--fap-blue);
      margin-right: 8px;
    }

    .status-badge.approved {
      background: #dcfce7;
      color: #166534;
    }

    .status-badge.rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .request-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .btn-approve {
      background: linear-gradient(90deg, var(--fap-navy), var(--fap-blue));
      color: var(--fap-white);
      border-bottom: 2px solid var(--fap-gold);
    }

    .btn-reject {
      background: #dc2626;
      color: var(--fap-white);
    }

    .btn-refresh {
      background: var(--fap-white);
      color: var(--fap-navy);
      border: 2px solid var(--fap-gold);
    }

    /* حاوية تصدير البطاقة */
    #fapPdfExportWrapper {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 860px;
      height: 480px;
      background: #ffffff;
      overflow: hidden;
      z-index: -1;
    }

    .fap-card {
      width: 860px;
      height: 480px;
      background: var(--fap-white);
      border: 3px solid var(--fap-gold);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      direction: rtl;
    }

    .fap-card-header {
      background: linear-gradient(90deg, var(--fap-navy) 0%, var(--fap-blue) 100%);
      color: var(--fap-white);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid var(--fap-gold);
    }

    .fap-brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .fap-logo-svg {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      border-radius: 50%;
      box-shadow: 0 0 0 2px var(--fap-gold);
    }

    .fap-short-name {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--fap-white);
    }

    .fap-gold-tag {
      background: rgba(212, 175, 55, 0.22);
      color: var(--fap-gold-light);
      border: 1px solid var(--fap-gold);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
    }

    .fap-card-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 36px;
      gap: 32px;
      background: radial-gradient(circle at top left, rgba(212, 175, 55, 0.09), transparent 45%), #ffffff;
    }

    .fap-member-photo-box {
      width: 210px;
      height: 250px;
      border-radius: 16px;
      border: 3px solid var(--fap-blue);
      outline: 3px solid var(--fap-gold);
      outline-offset: 3px;
      overflow: hidden;
      background: #eef3fa;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fap-member-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .fap-member-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .fap-field-row {
      background: #f6f9fe;
      border-right: 5px solid var(--fap-blue);
      border-left: 2px solid rgba(212, 175, 55, 0.65);
      border-radius: 10px;
      padding: 11px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
    }

    .fap-field-label {
      color: var(--fap-navy);
      font-weight: 800;
      min-width: 110px;
    }

    .fap-field-value {
      color: var(--fap-text);
      font-weight: 700;
    }

    .fap-card-footer {
      height: 12px;
      background: linear-gradient(90deg, var(--fap-gold) 0%, var(--fap-gold-light) 50%, var(--fap-gold) 100%);
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <header class="dashboard-header">
      <div>
        <h1>لوحة قائد فريق FAP</h1>
        <p>إدارة طلبات الانضمام وتوليد وإرسال بطاقات العضوية PDF</p>
      </div>
      <button id="refreshBtn" class="btn btn-refresh" type="button">تحديث القائمة</button>
    </header>

    <main id="requestsContainer" class="requests-list"></main>
  </div>

  <!-- قالب بطاقة العضوية مع شعار FAP المثبت كجزء من البطاقة -->
  <div id="fapPdfExportWrapper">
    <div id="fapMembershipCard" class="fap-card">
      <div class="fap-card-header">
        <div class="fap-brand-group">
          <svg class="fap-logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="FAP Logo">
            <defs>
              <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f5dc86" />
                <stop offset="50%" stop-color="#d4af37" />
                <stop offset="100%" stop-color="#9c7816" />
              </linearGradient>
              <radialGradient id="navyBg" cx="50%" cy="45%" r="55%">
                <stop offset="0%" stop-color="#14325c" />
                <stop offset="100%" stop-color="#071326" />
              </radialGradient>
            </defs>

            <circle cx="100" cy="100" r="96" fill="url(#navyBg)" stroke="url(#goldGrad)" stroke-width="6" />
            <circle cx="100" cy="100" r="84" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85" />
            <circle cx="100" cy="100" r="68" fill="none" stroke="#6495ed" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7" />

            <ellipse cx="100" cy="102" rx="54" ry="18" transform="rotate(-24 100 102)" fill="none" stroke="#4ea8de" stroke-width="2.5" opacity="0.85" />
            <circle cx="146" cy="80" r="4.5" fill="#f97316" />
            <circle cx="56" cy="122" r="3.5" fill="#38bdf8" />

            <polygon
              points="100,34 113,76 154,68 122,96 146,132 106,112 94,134 82,112 46,128 74,95 44,68 86,76"
              fill="url(#goldGrad)"
            />
            <circle cx="100" cy="30" r="3.5" fill="#f5dc86" />

            <rect x="54" y="122" width="92" height="32" rx="8" fill="#0b2244" stroke="url(#goldGrad)" stroke-width="3" />
            <text x="100" y="144" text-anchor="middle" fill="#ffffff" font-family="Cairo, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="2">FAP</text>
          </svg>

          <span class="fap-short-name">FAP</span>
        </div>
        <span class="fap-gold-tag">بطاقة عضوية</span>
      </div>

      <div class="fap-card-body">
        <div class="fap-member-photo-box">
          <img id="fapMemberImg" src="" alt="Member Photo" />
        </div>

        <div class="fap-member-details">
          <div class="fap-field-row">
            <span class="fap-field-label">العضو:</span>
            <span id="fapMemberName" class="fap-field-value">-</span>
          </div>
          <div class="fap-field-row">
            <span class="fap-field-label">الجامعة:</span>
            <span id="fapMemberUni" class="fap-field-value">-</span>
          </div>
          <div class="fap-field-row">
            <span class="fap-field-label">العمر:</span>
            <span id="fapMemberAge" class="fap-field-value">-</span>
          </div>
          <div class="fap-field-row">
            <span class="fap-field-label">المحافظة:</span>
            <span id="fapMemberGov" class="fap-field-value">-</span>
          </div>
        </div>
      </div>

      <div class="fap-card-footer"></div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxU6HteX9Ip4Fs7iSixNPCq93HNmdB1unlb0fb0WOiNh4JJ6ZZuNoqMfpCBOhF--evr/exec';

    function shortenUniversity(uni) {
      if (!uni) return '-';
      const clean = String(uni).trim();
      const map = {
        'جامعة بغداد': 'UOB',
        'الجامعة التقنية الوسطى': 'MTU',
        'الكلية التقنية الهندسية الكهربائية': 'ETEC',
        'الجامعة المستنصرية': 'UOM'
      };
      return map[clean] || clean;
    }

    let memberRequests = [];

    function normalizeImageUrl(url) {
      if (!url || typeof url !== 'string') return '';
      const trimmed = url.trim();

      const fileMatch = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fileMatch && fileMatch[1]) {
        return `https://lh3.googleusercontent.com/d/${fileMatch[1]}`;
      }

      const idMatch = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (trimmed.includes('drive.google.com') && idMatch && idMatch[1]) {
        return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
      }

      return trimmed;
    }

    function loadPhotoSafely(imgEl, rawUrl) {
      return new Promise((resolve) => {
        const src = normalizeImageUrl(rawUrl);
        if (!imgEl || !src) {
          if (imgEl) {
            imgEl.removeAttribute('crossOrigin');
            imgEl.src = '';
          }
          return resolve(false);
        }

        const isDataOrBlob = src.startsWith('data:') || src.startsWith('blob:');
        if (!isDataOrBlob) {
          imgEl.crossOrigin = 'anonymous';
        } else {
          imgEl.removeAttribute('crossOrigin');
        }

        const finish = (ok) => {
          imgEl.onload = null;
          imgEl.onerror = null;
          resolve(ok);
        };

        imgEl.onload = () => finish(true);
        imgEl.onerror = () => {
          if (!isDataOrBlob && imgEl.crossOrigin === 'anonymous') {
            imgEl.removeAttribute('crossOrigin');
            imgEl.onload = () => finish(true);
            imgEl.onerror = () => {
              imgEl.src = '';
              finish(false);
            };
            imgEl.src = src;
          } else {
            imgEl.src = '';
            finish(false);
          }
        };

        imgEl.src = src;

        if (imgEl.complete && imgEl.naturalWidth > 0) {
          finish(true);
        }
      });
    }

    async function generateFapMembershipPdf(member, autoDownload = true) {
      if (!window.html2canvas || !window.jspdf || !window.jspdf.jsPDF) {
        throw new Error('لم يتم تحميل مكتبتي html2canvas أو jsPDF.');
      }

      document.getElementById('fapMemberName').textContent = (member.name || '-').trim();
      document.getElementById('fapMemberUni').textContent = shortenUniversity(member.universityShort || member.university || '-');
      document.getElementById('fapMemberAge').textContent = (member.age || '-').toString().trim();
      document.getElementById('fapMemberGov').textContent = (member.governorate || '-').trim();

      const photoEl = document.getElementById('fapMemberImg');
      await loadPhotoSafely(photoEl, member.photoUrl || '');

      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      const cardEl = document.getElementById('fapMembershipCard');
      let canvas;
      try {
        canvas = await html2canvas(cardEl, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#ffffff',
          width: 860,
          height: 480
        });
      } catch (canvasErr) {
        photoEl.src = '';
        canvas = await html2canvas(cardEl, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#ffffff',
          width: 860,
          height: 480
        });
      }

      const imgData = canvas.toDataURL('image/png', 1.0);
      const { jsPDF } = window.jspdf;

      const pdf = new jsPDF({
        orientation: 'landscape',
        unit: 'px',
        format: [860, 480],
        hotfixes: ['px_scaling']
      });

      pdf.addImage(imgData, 'PNG', 0, 0, 860, 480);

      const safeId = (member.id || 'Member').toString().trim().replace(/[^\w\u0600-\u06FF-]+/g, '_');
      const fileName = `FAP_Membership_Card_${safeId}.pdf`;

      if (autoDownload) {
        pdf.save(fileName);
      }

      return {
        fileName,
        blob: pdf.output('blob')
      };
    }

    async function sendCardViaAppsScript(member, fileName, blob) {
      if (!APPS_SCRIPT_URL || !member.email) return;

      const base64Pdf = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(String(reader.result).split(',')[1] || '');
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });

      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'approveAndSendCard',
          memberId: member.id,
          name: member.name,
          email: member.email,
          fileName,
          pdfBase64: base64Pdf
        })
      });
    }

    async function approveAndGenerateCard(index, buttonEl) {
      const item = memberRequests[index];
      if (!item) return;

      if (buttonEl) buttonEl.disabled = true;

      try {
        item.status = 'Approved';
        renderRequests();

        const { fileName, blob } = await generateFapMembershipPdf(item, true);
        await sendCardViaAppsScript(item, fileName, blob);
      } catch (err) {
        console.error(err);
        alert('حدث خطأ أثناء تجهيز البطاقة: ' + err.message);
      } finally {
        if (buttonEl) buttonEl.disabled = false;
      }
    }

    async function loadRequestsFromSource() {
      if (!APPS_SCRIPT_URL) {
        renderRequests();
        return;
      }

      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        const rows = Array.isArray(data) ? data : (data.requests || data.data || []);

        memberRequests = rows.map((row, idx) => ({
          id: row.MemberID || row['Member ID'] || row.id || `FAP-2026-${idx + 1}`,
          name: row.FullName || row['Full Name'] || row.name || '-',
          universityShort: shortenUniversity(row.University || row.university || '-'),
          age: row.Age || row.age || '-',
          governorate: row.Governorate || row.governorate || '-',
          email: row.Email || row.email || '',
          photoUrl: row.PhotoURL || row['Photo URL'] || row.photoUrl || '',
          status: row.Status || row.status || 'Pending'
        }));
      } catch (err) {
        console.error('تعذر جلب الطلبات:', err);
      }

      renderRequests();
    }

    function renderRequests() {
      const container = document.getElementById('requestsContainer');
      container.innerHTML = '';

      if (!memberRequests.length) {
        container.innerHTML = '<div class="request-card">لا توجد طلبات حالياً.</div>';
        return;
      }

      memberRequests.forEach((req, index) => {
        const card = document.createElement('div');
        card.className = 'request-card';

        const statusClass =
          req.status === 'Approved' ? 'approved' : req.status === 'Rejected' ? 'rejected' : '';

        card.innerHTML = `
          <div class="request-info">
            <h2>
              ${req.name} (${req.id})
              <span class="status-badge ${statusClass}">${req.status || 'Pending'}</span>
            </h2>
            <div class="request-meta">
              <span>العمر: ${req.age}</span>
              <span>المحافظة: ${req.governorate}</span>
              <span>الجامعة: ${req.universityShort}</span>
            </div>
          </div>
          <div class="request-actions">
            <button class="btn btn-approve" type="button" data-index="${index}">موافقة وإرسال البطاقة</button>
            <button class="btn btn-reject" type="button" data-index="${index}">رفض</button>
          </div>
        `;

        container.appendChild(card);
      });

      container.querySelectorAll('.btn-approve').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const idx = Number(e.currentTarget.dataset.index);
          approveAndGenerateCard(idx, e.currentTarget);
        });
      });

      container.querySelectorAll('.btn-reject').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const idx = Number(e.currentTarget.dataset.index);
          if (!memberRequests[idx]) return;
          memberRequests[idx].status = 'Rejected';
          renderRequests();
        });
      });
    }

    document.getElementById('refreshBtn').addEventListener('click', () => {
      loadRequestsFromSource();
    });

    loadRequestsFromSource();
  </script>
</body>
</html>
