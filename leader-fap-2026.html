<!-- تأكد من تضمين مكتبتي html2canvas و jsPDF (أو html2pdf) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  #fapPdfExportWrapper {
    position: fixed;
    left: -10000px;
    top: 0;
    width: 860px;
    height: 480px;
    background: #ffffff;
    overflow: hidden;
    z-index: -1;
  }

  .fap-card {
    width: 860px;
    height: 480px;
    background: #ffffff;
    border: 3px solid #d4af37;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    direction: rtl;
    box-sizing: border-box;
  }

  .fap-card-header {
    background: linear-gradient(90deg, #0b2c5d 0%, #154c9e 100%);
    color: #ffffff;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 4px solid #d4af37;
  }

  .fap-brand-group {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .fap-team-logo {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #d4af37;
    background: #0b2c5d;
  }

  .fap-short-name {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffffff;
    line-height: 1.1;
  }

  .fap-gold-tag {
    background: rgba(212, 175, 55, 0.2);
    color: #f9e29c;
    border: 1px solid #d4af37;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
  }

  .fap-card-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 26px 36px;
    gap: 32px;
    background: radial-gradient(circle at top left, rgba(212, 175, 55, 0.08), transparent 45%), #ffffff;
  }

  .fap-member-photo-box {
    width: 210px;
    height: 250px;
    border-radius: 16px;
    border: 3px solid #154c9e;
    outline: 3px solid #d4af37;
    outline-offset: 3px;
    overflow: hidden;
    background: #eef3fa;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .fap-member-photo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .fap-member-details {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .fap-field-row {
    background: #f6f9fe;
    border-right: 5px solid #154c9e;
    border-left: 2px solid rgba(212, 175, 55, 0.6);
    border-radius: 10px;
    padding: 11px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
  }

  .fap-field-label {
    color: #0b2c5d;
    font-weight: 800;
    min-width: 110px;
  }

  .fap-field-value {
    color: #111827;
    font-weight: 700;
  }

  .fap-card-footer {
    height: 12px;
    background: linear-gradient(90deg, #d4af37 0%, #f3d678 50%, #d4af37 100%);
  }
</style>

<div id="fapPdfExportWrapper">
  <div id="fapMembershipCard" class="fap-card">
    <div class="fap-card-header">
      <div class="fap-brand-group">
        <img id="fapLogoImg" class="fap-team-logo" src="" alt="FAP Logo" />
        <span class="fap-short-name">FAP</span>
      </div>
      <span class="fap-gold-tag">بطاقة عضوية</span>
    </div>

    <div class="fap-card-body">
      <div class="fap-member-photo-box">
        <img id="fapMemberImg" src="" alt="Member Photo" />
      </div>

      <div class="fap-member-details">
        <div class="fap-field-row">
          <span class="fap-field-label">العضو:</span>
          <span id="fapMemberName" class="fap-field-value">-</span>
        </div>
        <div class="fap-field-row">
          <span class="fap-field-label">الجامعة:</span>
          <span id="fapMemberUni" class="fap-field-value">-</span>
        </div>
        <div class="fap-field-row">
          <span class="fap-field-label">العمر:</span>
          <span id="fapMemberAge" class="fap-field-value">-</span>
        </div>
        <div class="fap-field-row">
          <span class="fap-field-label">المحافظة:</span>
          <span id="fapMemberGov" class="fap-field-value">-</span>
        </div>
      </div>
    </div>

    <div class="fap-card-footer"></div>
  </div>
</div>

<script>
  function loadImageSafely(imgEl, src) {
    return new Promise((resolve) => {
      if (!imgEl || !src) {
        if (imgEl) {
          imgEl.removeAttribute('crossOrigin');
          imgEl.src = '';
        }
        return resolve(false);
      }

      const isDataOrBlob = src.startsWith('data:') || src.startsWith('blob:');
      if (!isDataOrBlob) {
        imgEl.crossOrigin = 'anonymous';
      } else {
        imgEl.removeAttribute('crossOrigin');
      }

      const cleanupAndResolve = (ok) => {
        imgEl.onload = null;
        imgEl.onerror = null;
        resolve(ok);
      };

      imgEl.onload = () => cleanupAndResolve(true);
      imgEl.onerror = () => {
        // إعادة المحاولة بدون crossOrigin إذا كان رابط خارجي يرفض CORS مع html2canvas
        if (!isDataOrBlob && imgEl.crossOrigin === 'anonymous') {
          imgEl.removeAttribute('crossOrigin');
          imgEl.onload = () => cleanupAndResolve(true);
          imgEl.onerror = () => cleanupAndResolve(false);
          imgEl.src = src;
        } else {
          cleanupAndResolve(false);
        }
      };

      imgEl.src = src;

      if (imgEl.complete && imgEl.naturalWidth > 0) {
        cleanupAndResolve(true);
      }
    });
  }

  async function generateFapMembershipPdf(memberData, autoDownload = true) {
    if (!window.html2canvas || !window.jspdf || !window.jspdf.jsPDF) {
      throw new Error('تأكد من تحميل مكتبتي html2canvas و jsPDF بشكل صحيح.');
    }

    document.getElementById('fapMemberName').textContent = (memberData.name || '-').trim();
    document.getElementById('fapMemberUni').textContent = (memberData.universityShort || '-').trim();
    document.getElementById('fapMemberAge').textContent = (memberData.age || '-').toString().trim();
    document.getElementById('fapMemberGov').textContent = (memberData.governorate || '-').trim();

    const logoEl = document.getElementById('fapLogoImg');
    const photoEl = document.getElementById('fapMemberImg');

    await Promise.all([
      loadImageSafely(logoEl, memberData.logoUrl || ''),
      loadImageSafely(photoEl, memberData.photoUrl || '')
    ]);

    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }

    const cardEl = document.getElementById('fapMembershipCard');
    const canvas = await html2canvas(cardEl, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#ffffff',
      width: 860,
      height: 480
    });

    const imgData = canvas.toDataURL('image/png', 1.0);
    const { jsPDF } = window.jspdf;

    // صفحة PDF بنفس أبعاد البطاقة تماماً (860x480 نقطة) لمنع التصغير أو الفراغ الزائد
    const pdf = new jsPDF({
      orientation: 'landscape',
      unit: 'px',
      format: [860, 480],
      hotfixes: ['px_scaling']
    });

    pdf.addImage(imgData, 'PNG', 0, 0, 860, 480);

    const safeName = (memberData.name || 'Member').trim().replace(/[^\w\u0600-\u06FF-]+/g, '_');
    const fileName = `FAP_Membership_Card_${safeName}.pdf`;

    if (autoDownload) {
      pdf.save(fileName);
    }

    return {
      fileName,
      blob: pdf.output('blob')
    };
  }
</script>
