<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة القائد — FAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg-dark: #071936;
      --bg-mid: #0e356e;
      --bg-card: #0b244c;
      --gold: #f5d061;
      --gold-dark: #d4af37;
      --fap-navy: #0b2c5d;
      --fap-blue: #154c9e;
      --text-main: #f8fafc;
      --text-muted: #bfdbfe;
      --border: rgba(212, 175, 55, 0.32);
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top right, rgba(21, 76, 158, 0.65), transparent 48%),
        radial-gradient(circle at bottom left, rgba(212, 175, 55, 0.14), transparent 42%),
        linear-gradient(160deg, var(--bg-dark) 0%, var(--bg-mid) 55%, #06152e 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 24px 16px;
      border-bottom: 2px solid var(--gold-dark);
      margin-bottom: 24px;
      background: linear-gradient(90deg, rgba(11, 44, 93, 0.92), rgba(21, 76, 158, 0.92));
      border-radius: 16px;
    }

    header h1 {
      color: var(--gold);
      font-size: 1.7rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 28px rgba(3, 12, 28, 0.35);
    }

    .hidden {
      display: none !important;
    }

    .login-box {
      max-width: 380px;
      margin: 16px auto;
      text-align: center;
    }

    input {
      width: 100%;
      background: #071936;
      border: 1px solid rgba(147, 197, 253, 0.35);
      color: var(--text-main);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .btn-gold {
      width: 100%;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: #060d1a;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-refresh {
      width: auto;
      margin-bottom: 16px;
    }

    .app-item {
      background: linear-gradient(135deg, rgba(14, 53, 110, 0.92), rgba(7, 25, 54, 0.96));
      border: 1px solid var(--border);
      border-right: 4px solid var(--gold);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .status-pill {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .status-Pending { background: rgba(245, 208, 97, 0.2); color: var(--gold); }
    .status-Approved { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .status-Rejected { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

    .app-details {
      font-size: 0.92rem;
      color: #e2e8f0;
      line-height: 1.75;
    }

    .app-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .btn-approve, .btn-reject {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-approve { background: var(--success); color: #fff; }
    .btn-reject { background: var(--danger); color: #fff; }

    /* حاوية تصدير بطاقة العضوية PDF */
    #fapPdfExportWrapper {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 860px;
      height: 480px;
      background: #ffffff;
      overflow: hidden;
      z-index: -1;
    }

    .fap-card {
      width: 860px;
      height: 480px;
      background: #ffffff;
      border: 3px solid var(--gold-dark);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      direction: rtl;
    }

    .fap-card-header {
      background: linear-gradient(90deg, var(--fap-navy) 0%, var(--fap-blue) 100%);
      color: #ffffff;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 4px solid var(--gold-dark);
    }

    .fap-brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .fap-logo-svg {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      border-radius: 50%;
      box-shadow: 0 0 0 2px var(--gold-dark);
    }

    .fap-short-name {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
    }

    .fap-gold-tag {
      background: rgba(212, 175, 55, 0.22);
      color: var(--gold);
      border: 1px solid var(--gold-dark);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
    }

    .fap-card-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 36px;
      gap: 32px;
      background: radial-gradient(circle at top left, rgba(212, 175, 55, 0.09), transparent 45%), #ffffff;
    }

    .fap-member-photo-box {
      width: 210px;
      height: 250px;
      border-radius: 16px;
      border: 3px solid var(--fap-blue);
      outline: 3px solid var(--gold-dark);
      outline-offset: 3px;
      overflow: hidden;
      background: #eef3fa;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fap-member-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .fap-member-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .fap-field-row {
      background: #f6f9fe;
      border-right: 5px solid var(--fap-blue);
      border-left: 2px solid rgba(212, 175, 55, 0.65);
      border-radius: 10px;
      padding: 11px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
    }

    .fap-field-label {
      color: var(--fap-navy);
      font-weight: 800;
      min-width: 110px;
    }

    .fap-field-value {
      color: #111827;
      font-weight: 700;
    }

    .fap-card-footer {
      height: 12px;
      background: linear-gradient(90deg, var(--gold-dark) 0%, var(--gold) 50%, var(--gold-dark) 100%);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>لوحة قائد فريق FAP</h1>
      <p style="color: var(--text-muted);">إدارة طلبات الانضمام وإرسال بطاقات العضوية PDF</p>
    </header>

    <div class="card">
      <div id="loginBox" class="login-box">
        <h3 style="color: var(--gold); margin-bottom: 12px;">دخول القائد</h3>
        <input type="password" id="passInput" placeholder="أدخل رمز المرور" />
        <button class="btn-gold" onclick="login()">دخول</button>
        <p id="errMsg" style="color: #fca5a5; margin-top: 10px; font-size: 0.9rem;"></p>
      </div>

      <div id="panelBox" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
          <h3 style="color: var(--gold); margin-bottom: 16px;">الطلبات الواردة</h3>
          <button class="btn-gold btn-refresh" onclick="loadApps()">تحديث القائمة ↻</button>
        </div>
        <div id="appsList">جاري التحميل...</div>
      </div>
    </div>
  </div>

  <!-- قالب بطاقة العضوية مع شعار FAP المثبت كجزء من البطاقة -->
  <div id="fapPdfExportWrapper">
    <div id="fapMembershipCard" class="fap-card">
      <div class="fap-card-header">
        <div class="fap-brand-group">
          <svg class="fap-logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="FAP Logo">
            <defs>
              <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f5dc86" />
                <stop offset="50%" stop-color="#d4af37" />
                <stop offset="100%" stop-color="#9c7816" />
              </linearGradient>
              <radialGradient id="navyBg" cx="50%" cy="45%" r="55%">
                <stop offset="0%" stop-color="#14325c" />
                <stop offset="100%" stop-color="#071326" />
              </radialGradient>
            </defs>

            <circle cx="100" cy="100" r="96" fill="url(#navyBg)" stroke="url(#goldGrad)" stroke-width="6" />
            <circle cx="100" cy="100" r="84" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85" />
            <circle cx="100" cy="100" r="68" fill="none" stroke="#6495ed" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7" />

            <ellipse cx="100" cy="102" rx="54" ry="18" transform="rotate(-24 100 102)" fill="none" stroke="#4ea8de" stroke-width="2.5" opacity="0.85" />
            <circle cx="146" cy="80" r="4.5" fill="#f97316" />
            <circle cx="56" cy="122" r="3.5" fill="#38bdf8" />

            <polygon
              points="100,34 113,76 154,68 122,96 146,132 106,112 94,134 82,112 46,128 74,95 44,68 86,76"
              fill="url(#goldGrad)"
            />
            <circle cx="100" cy="30" r="3.5" fill="#f5dc86" />

            <rect x="54" y="122" width="92" height="32" rx="8" fill="#0b2244" stroke="url(#goldGrad)" stroke-width="3" />
            <text x="100" y="144" text-anchor="middle" fill="#ffffff" font-family="Cairo, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="2">FAP</text>
          </svg>

          <span class="fap-short-name">FAP</span>
        </div>
        <span class="fap-gold-tag">بطاقة عضوية</span>
      </div>

      <div class="fap-card-body">
        <div class="fap-member-photo-box">
          <img id="fapMemberImg" src="" alt="Member Photo" />
        </div>

        <div class="fap-member-details">
          <div class="fap-field-row">
            <span class="fap-field-label">العضو:</span>
            <span id="fapMemberName" class="fap-field-value">-</span>
          </div>
          <div class="fap-field-row">
            <span class="fap-field-label">الجامعة:</span>
            <span id="fapMemberUni" class="fap-field-value">-</span>
          </div>
          <div class="fap-field-row">
            <span class="fap-field-label">العمر:</span>
            <span id="fapMemberAge" class="fap-field-value">-</span>
          </div>
          <div class="fap-field-row">
            <span class="fap-field-label">المحافظة:</span>
            <span id="fapMemberGov" class="fap-field-value">-</span>
          </div>
        </div>
      </div>

      <div class="fap-card-footer"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxodenQpP6k3WWaeztL24MxLiy2u5inBm7fWBFAe4_Wtf8eFWsUF0uvv9nnf4jgNQd0/exec';
    const ADMIN_PASS = 'FAP2026';
    let currentApplications = [];

    function login() {
      if (document.getElementById('passInput').value === ADMIN_PASS) {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('panelBox').classList.remove('hidden');
        loadApps();
      } else {
        document.getElementById('errMsg').textContent = 'رمز المرور غير صحيح';
      }
    }

    function shortenUniversity(uni) {
      if (!uni) return '-';
      const clean = String(uni).trim();
      const map = {
        'جامعة بغداد': 'UOB',
        'الجامعة التقنية الوسطى': 'MTU',
        'الكلية التقنية الهندسية الكهربائية': 'ETEC',
        'الجامعة المستنصرية': 'UOM'
      };
      return map[clean] || clean;
    }

    function normalizeImageUrl(url) {
      if (!url || typeof url !== 'string') return '';
      const trimmed = url.trim();

      const fileMatch = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fileMatch && fileMatch[1]) {
        return `https://lh3.googleusercontent.com/d/${fileMatch[1]}`;
      }

      const idMatch = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (trimmed.includes('drive.google.com') && idMatch && idMatch[1]) {
        return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
      }

      return trimmed;
    }

    function loadPhotoSafely(imgEl, rawUrl) {
      return new Promise((resolve) => {
        const src = normalizeImageUrl(rawUrl);
        if (!imgEl || !src) {
          if (imgEl) {
            imgEl.removeAttribute('crossOrigin');
            imgEl.src = '';
          }
          return resolve(false);
        }

        const isDataOrBlob = src.startsWith('data:') || src.startsWith('blob:');
        if (!isDataOrBlob) {
          imgEl.crossOrigin = 'anonymous';
        } else {
          imgEl.removeAttribute('crossOrigin');
        }

        const finish = (ok) => {
          imgEl.onload = null;
          imgEl.onerror = null;
          resolve(ok);
        };

        imgEl.onload = () => finish(true);
        imgEl.onerror = () => {
          if (!isDataOrBlob && imgEl.crossOrigin === 'anonymous') {
            imgEl.removeAttribute('crossOrigin');
            imgEl.onload = () => finish(true);
            imgEl.onerror = () => {
              imgEl.src = '';
              finish(false);
            };
            imgEl.src = src;
          } else {
            imgEl.src = '';
            finish(false);
          }
        };

        imgEl.src = src;

        if (imgEl.complete && imgEl.naturalWidth > 0) {
          finish(true);
        }
      });
    }

    async function generateFapMembershipPdf(app, autoDownload = true) {
      if (!window.html2canvas || !window.jspdf || !window.jspdf.jsPDF) {
        throw new Error('لم يتم تحميل مكتبتي html2canvas أو jsPDF.');
      }

      document.getElementById('fapMemberName').textContent = (app.fullName || '-').trim();
      document.getElementById('fapMemberUni').textContent = shortenUniversity(app.university || '-');
      document.getElementById('fapMemberAge').textContent = (app.age || '-').toString().trim();
      document.getElementById('fapMemberGov').textContent = (app.governorate || '-').trim();

      const photoEl = document.getElementById('fapMemberImg');
      await loadPhotoSafely(photoEl, app.photoUrl || '');

      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      const cardEl = document.getElementById('fapMembershipCard');
      let canvas;
      try {
        canvas = await html2canvas(cardEl, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#ffffff',
          width: 860,
          height: 480
        });
      } catch (canvasErr) {
        photoEl.src = '';
        canvas = await html2canvas(cardEl, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#ffffff',
          width: 860,
          height: 480
        });
      }

      const imgData = canvas.toDataURL('image/png', 1.0);
      const { jsPDF } = window.jspdf;

      const pdf = new jsPDF({
        orientation: 'landscape',
        unit: 'px',
        format: [860, 480],
        hotfixes: ['px_scaling']
      });

      pdf.addImage(imgData, 'PNG', 0, 0, 860, 480);

      const safeId = (app.memberId || app.fullName || 'Member').toString().trim().replace(/[^\w\u0600-\u06FF-]+/g, '_');
      const fileName = `FAP_Membership_Card_${safeId}.pdf`;

      if (autoDownload) {
        pdf.save(fileName);
      }

      const dataUrl = pdf.output('datauristring');
      const pdfBase64 = dataUrl.includes(',') ? dataUrl.split(',')[1] : '';

      return { fileName, pdfBase64 };
    }

    async function loadApps() {
      const list = document.getElementById('appsList');
      list.innerHTML = 'جاري جلب الطلبات...';

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'get_applications' })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'فشل الجلب');

        if (!data.applications || data.applications.length === 0) {
          currentApplications = [];
          list.innerHTML = '<p style="color: var(--text-muted);">لا توجد طلبات حالياً.</p>';
          return;
        }

        currentApplications = data.applications.slice().reverse();

        list.innerHTML = currentApplications.map((app, idx) => `
          <div class="app-item">
            <div class="app-header">
              <div>
                <strong style="color: var(--gold);">${app.fullName}</strong>
                <span style="color: var(--text-muted); font-size: 0.85rem;"> (${app.memberId})</span>
              </div>
              <span class="status-pill status-${app.status}">${app.status}</span>
            </div>
            <div class="app-details">
              <div><strong>العمر:</strong> ${app.age} | <strong>المحافظة:</strong> ${app.governorate}</div>
              <div><strong>الجامعة/الجهة:</strong> ${app.university}</div>
              <div><strong>البريد:</strong> ${app.email}</div>
              <div><strong>المهارات:</strong> ${app.skills}</div>
              <div><strong>المسابقات:</strong> ${app.competitions || 'لا يوجد'}</div>
              ${app.photoUrl ? `<div><a href="${app.photoUrl}" target="_blank" style="color: var(--gold);">عرض الصورة الشخصية ↗</a></div>` : ''}
            </div>
            <div class="app-actions">
              <button class="btn-approve" onclick="decide(${idx}, 'approve_member', this)">موافقة وإرسال البطاقة ✓</button>
              <button class="btn-reject" onclick="decide(${idx}, 'reject_member', this)">رفض ✕</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<p style="color: #fca5a5;">خطأ: ${err.message}</p>`;
      }
    }

    async function decide(index, action, btn) {
      const app = currentApplications[index];
      if (!app) return;

      const old = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'جاري التنفيذ...';
      try {
        let cardPayload = {};
        if (action === 'approve_member') {
          const { fileName, pdfBase64 } = await generateFapMembershipPdf(app, true);
          cardPayload = {
            fileName,
            pdfBase64,
            memberId: app.memberId,
            fullName: app.fullName,
            email: app.email
          };
        }

        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action,
            rowIndex: app.rowIndex,
            ...cardPayload
          })
        });

        alert(
          action === 'approve_member'
            ? 'تمت الموافقة وتوليد بطاقة PDF وإرسالها!'
            : 'تم تحديث حالة رفض الطلب.'
        );
        setTimeout(loadApps, 1200);
      } catch (err) {
        alert('خطأ: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = old;
      }
    }
  </script>
</body>
</html>
