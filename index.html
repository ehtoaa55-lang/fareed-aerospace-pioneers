<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAP — Fareed Aerospace Pioneers Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #060d1a;
      --bg-card: #0d1b33;
      --gold: #f5d061;
      --gold-dark: #d4af37;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(212, 175, 55, 0.25);
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #102547 0%, var(--bg-dark) 65%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 28px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold);
      border: 1px solid var(--gold-dark);
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 1.9rem;
      color: var(--gold);
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      margin-bottom: 24px;
    }

    .section-title {
      color: var(--gold);
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--gold);
    }

    input, select, textarea {
      background: #081224;
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: var(--text-main);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
    }

    textarea {
      resize: vertical;
      min-height: 85px;
    }

    /* معاينة نموذج البطاقة */
    .preview-box {
      background: linear-gradient(135deg, #060d1a 0%, #112342 100%);
      border: 2px solid var(--gold-dark);
      border-radius: 16px;
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .preview-info {
      flex: 1;
      min-width: 240px;
    }

    .preview-org {
      color: var(--gold);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .preview-card-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 4px 0 12px;
      color: #fff;
    }

    .preview-line {
      font-size: 0.92rem;
      color: #e2e8f0;
      margin-bottom: 6px;
    }

    .preview-line span {
      color: var(--gold);
      font-weight: 700;
    }

    .preview-avatar {
      width: 95px;
      height: 95px;
      border-radius: 14px;
      border: 2px solid var(--gold);
      object-fit: cover;
      background: #081224;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-align: center;
      overflow: hidden;
    }

    .preview-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .submit-btn {
      width: 100%;
      margin-top: 20px;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: #060d1a;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      display: none;
      text-align: center;
    }

    .alert.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: #6ee7b7;
      display: block;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">FAREED AEROSPACE PIONEERS (FAP)</div>
      <h1>فريق رواد كابتن فريد للفضاء والطيران</h1>
      <p>البوابة الرسمية للتسجيل والانضمام إلى الفريق</p>
    </header>

    <div class="card">
      <div class="section-title">استمارة طلب الانضمام</div>
      <form id="fapForm">
        <div class="form-grid">
          <div class="form-group">
            <label>الاسم الكامل (يفضل بالإنكليزية للبطاقة) *</label>
            <input type="text" id="fullName" placeholder="مثال: Haydar Hassan Awaad" required oninput="updatePreview()" />
          </div>

          <div class="form-group">
            <label>العمر *</label>
            <input type="number" id="age" min="14" max="65" placeholder="مثال: 21" required />
          </div>

          <div class="form-group">
            <label>المحافظة *</label>
            <select id="governorate" required onchange="updatePreview()">
              <option value="">اختر المحافظة...</option>
              <option value="بغداد">بغداد</option>
              <option value="البصرة">البصرة</option>
              <option value="نينوى">نينوى</option>
              <option value="أربيل">أربيل</option>
              <option value="النجف">النجف</option>
              <option value="كربلاء">كربلاء</option>
              <option value="الأنبار">الأنبار</option>
              <option value="ديالى">ديالى</option>
              <option value="ذي قار">ذي قار</option>
              <option value="كركوك">كركوك</option>
              <option value="صلاح الدين">صلاح الدين</option>
              <option value="بابل">بابل</option>
              <option value="واسط">واسط</option>
              <option value="ميسان">ميسان</option>
              <option value="الديوانية">الديوانية</option>
              <option value="المثنى">المثنى</option>
              <option value="السليمانية">السليمانية</option>
              <option value="دهوك">دهوك</option>
            </select>
          </div>

          <div class="form-group">
            <label>الجامعة / الكلية *</label>
            <select id="universitySelect" required onchange="toggleCustomUni()">
              <option value="">اختر الجامعة...</option>
              <option value="الجامعة التقنية الوسطى">الجامعة التقنية الوسطى</option>
              <option value="جامعة بغداد">جامعة بغداد</option>
              <option value="الجامعة المستنصرية">الجامعة المستنصرية</option>
              <option value="جامعة التكنولوجيا">جامعة التكنولوجيا</option>
              <option value="جامعة النهرين">جامعة النهرين</option>
              <option value="جامعة البصرة">جامعة البصرة</option>
              <option value="الجامعة التقنية الجنوبية">الجامعة التقنية الجنوبية</option>
              <option value="جامعة الموصل">جامعة الموصل</option>
              <option value="الجامعة التقنية الشمالية">الجامعة التقنية الشمالية</option>
              <option value="جامعة الكوفة">جامعة الكوفة</option>
              <option value="جامعة كربلاء">جامعة كربلاء</option>
              <option value="جامعة الأنبار">جامعة الأنبار</option>
              <option value="جامعة بابل">جامعة بابل</option>
              <option value="جامعة ذي قار">جامعة ذي قار</option>
              <option value="جامعة تكريت">جامعة تكريت</option>
              <option value="جامعة ديالى">جامعة ديالى</option>
              <option value="جامعة واسط">جامعة واسط</option>
              <option value="جامعة ميسان">جامعة ميسان</option>
              <option value="جامعة القادسية">جامعة القادسية</option>
              <option value="جامعة المثنى">جامعة المثنى</option>
              <option value="جامعة كركوك">جامعة كركوك</option>
              <option value="أخرى / مدرسة">أخرى / مدرسة</option>
            </select>
          </div>

          <div class="form-group full" id="customUniGroup" style="display: none;">
            <label>اكتب اسم الجامعة أو المعهد أو المدرسة *</label>
            <input type="text" id="customUniversity" placeholder="اكتب الجهة التعليمية هنا..." oninput="updatePreview()" />
          </div>

          <div class="form-group full">
            <label>البريد الإلكتروني (لإرسال بطاقة العضوية PDF عند الموافقة) *</label>
            <input type="email" id="email" placeholder="example@gmail.com" required />
          </div>

          <div class="form-group full">
            <label>المهارات والخبرات الهندسية أو التقنية *</label>
            <textarea id="skills" placeholder="اكتب مهاراتك (تصميم، برمجة، طائرات مسيرة، أقمار صناعية، إلكترونيات...)" required></textarea>
          </div>

          <div class="form-group full">
            <label>المسابقات أو المشاريع السابقة (إن وجدت)</label>
            <textarea id="competitions" placeholder="اذكر مشاركاتك السابقة أو اكتب (لا يوجد)"></textarea>
          </div>

          <div class="form-group full">
            <label>الصورة الشخصية *</label>
            <input type="file" id="photoInput" accept="image/*" required onchange="previewPhoto(this)" />
          </div>

          <!-- معاينة شكل البطاقة للمتقدم -->
          <div class="form-group full">
            <label>معاينة نموذج بطاقة العضوية</label>
            <div class="preview-box">
              <div class="preview-info">
                <div class="preview-org">FAREED AEROSPACE PIONEERS (FAP)</div>
                <div class="preview-card-title">OFFICIAL MEMBERSHIP CARD</div>
                <div class="preview-line"><span>الاسم / Name:</span> <strong id="prevName">---</strong></div>
                <div class="preview-line"><span>الجهة / Affiliation:</span> <strong id="prevUni">---</strong></div>
                <div class="preview-line"><span>المحافظة / Governorate:</span> <strong id="prevGov">---</strong></div>
              </div>
              <div class="preview-avatar" id="prevAvatarBox">الصورة الشخصية</div>
            </div>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">إرسال طلب الانضمام</button>
        <div id="formAlert" class="alert"></div>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxsEVqHQszSyVUqnO5VcRsmyC2bGYL2RYP0vWiH2aCSeQ-B0-LYDS1RTB1MoVQFag3t/exec';

    function getSelectedUniversity() {
      const sel = document.getElementById('universitySelect').value;
      if (sel === 'أخرى / مدرسة') {
        return document.getElementById('customUniversity').value.trim();
      }
      return sel;
    }

    function toggleCustomUni() {
      const sel = document.getElementById('universitySelect').value;
      const box = document.getElementById('customUniGroup');
      const inp = document.getElementById('customUniversity');
      if (sel === 'أخرى / مدرسة') {
        box.style.display = 'flex';
        inp.required = true;
      } else {
        box.style.display = 'none';
        inp.required = false;
        inp.value = '';
      }
      updatePreview();
    }

    function updatePreview() {
      const nameVal = document.getElementById('fullName').value.trim();
      const govVal = document.getElementById('governorate').value.trim();
      const uniVal = getSelectedUniversity();

      document.getElementById('prevName').textContent = nameVal || '---';
      document.getElementById('prevGov').textContent = govVal || '---';
      document.getElementById('prevUni').textContent = uniVal || '---';
    }

    function previewPhoto(input) {
      const box = document.getElementById('prevAvatarBox');
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          box.innerHTML = `<img src="${e.target.result}" alt="Preview" />`;
        };
        reader.readAsDataURL(input.files[0]);
      } else {
        box.innerHTML = 'الصورة الشخصية';
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('fapForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('formAlert');
      alertBox.className = 'alert';
      alertBox.textContent = '';

      const photoFile = document.getElementById('photoInput').files[0];
      const universityFinal = getSelectedUniversity();
      if (!photoFile || !universityFinal) return;

      btn.disabled = true;
      btn.textContent = 'جاري رفع البيانات والصورة... يرجى الانتظار';

      try {
        const photoBase64 = await fileToBase64(photoFile);
        const payload = {
          action: 'submit_application',
          fullName: document.getElementById('fullName').value.trim(),
          age: document.getElementById('age').value.trim(),
          governorate: document.getElementById('governorate').value.trim(),
          university: universityFinal,
          email: document.getElementById('email').value.trim(),
          skills: document.getElementById('skills').value.trim(),
          competitions: document.getElementById('competitions').value.trim(),
          photoBase64: photoBase64
        };

        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          alertBox.className = 'alert success';
          alertBox.textContent = 'تم إرسال طلبك بنجاح! رقم طلبك: ' + result.memberId + '. ستصلك بطاقة العضوية على بريدك الإلكتروني فور موافقة القائد.';
          document.getElementById('fapForm').reset();
          document.getElementById('customUniGroup').style.display = 'none';
          document.getElementById('prevAvatarBox').innerHTML = 'الصورة الشخصية';
          updatePreview();
        } else {
          throw new Error(result.error || 'حدث خطأ أثناء الإرسال');
        }
      } catch (err) {
        alertBox.className = 'alert error';
        alertBox.textContent = 'تعذر إرسال الطلب: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'إرسال طلب الانضمام';
      }
    });
  </script>
</body>
</html>
