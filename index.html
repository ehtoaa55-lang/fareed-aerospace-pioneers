<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAP — Fareed Aerospace Pioneers Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #060d1a;
      --bg-card: #0d1b33;
      --gold: #f5d061;
      --gold-dark: #d4af37;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(212, 175, 55, 0.25);
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #102547 0%, var(--bg-dark) 65%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 28px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }

    .badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold);
      border: 1px solid var(--gold-dark);
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 1.9rem;
      color: var(--gold);
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .tab-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: #060d1a;
      border-color: var(--gold);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--gold);
    }

    input, select, textarea {
      background: #081224;
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: var(--text-main);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
    }

    textarea {
      resize: vertical;
      min-height: 85px;
    }

    .submit-btn {
      width: 100%;
      margin-top: 20px;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: #060d1a;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      display: none;
      text-align: center;
    }

    .alert.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--success);
      color: #6ee7b7;
      display: block;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      display: block;
    }

    /* Leader Dashboard */
    .hidden {
      display: none !important;
    }

    .admin-login {
      text-align: center;
      max-width: 380px;
      margin: 20px auto;
    }

    .app-item {
      background: #081224;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
    }

    .status-pill {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .status-Pending { background: rgba(245, 208, 97, 0.2); color: var(--gold); }
    .status-Approved { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .status-Rejected { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

    .app-details {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.7;
    }

    .app-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-approve, .btn-reject, .btn-refresh {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-approve { background: var(--success); color: #fff; }
    .btn-reject { background: var(--danger); color: #fff; }
    .btn-refresh { background: var(--gold); color: #060d1a; margin-bottom: 16px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">FAREED AEROSPACE PIONEERS (FAP)</div>
      <h1>فريق رواد كابتن فريد للفضاء والطيران</h1>
      <p>البوابة الرسمية للتسجيل والانضمام إلى الفريق وإدارة العضويات</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" id="tabRegister" onclick="switchTab('register')">استمارة الانضمام</button>
      <button class="tab-btn" id="tabLeader" onclick="switchTab('leader')">لوحة القائد</button>
    </div>

    <!-- قسم التسجيل -->
    <div id="registerSection" class="card">
      <form id="fapForm">
        <div class="form-grid">
          <div class="form-group">
            <label>الاسم الكامل (يفضل بالإنكليزية للبطاقة) *</label>
            <input type="text" id="fullName" placeholder="مثال: Haydar Hassan Awaad" required />
          </div>

          <div class="form-group">
            <label>العمر *</label>
            <input type="number" id="age" min="15" max="60" placeholder="مثال: 21" required />
          </div>

          <div class="form-group">
            <label>المحافظة *</label>
            <input type="text" id="governorate" placeholder="مثال: بغداد" required />
          </div>

          <div class="form-group">
            <label>الجامعة / الكلية أو المدرسة *</label>
            <input type="text" id="university" placeholder="مثال: الجامعة التقنية الوسطى" required />
          </div>

          <div class="form-group full">
            <label>البريد الإلكتروني (لإرسال بطاقة العضوية PDF) *</label>
            <input type="email" id="email" placeholder="example@gmail.com" required />
          </div>

          <div class="form-group full">
            <label>المهارات والخبرات الهندسية أو التقنية *</label>
            <textarea id="skills" placeholder="اكتب مهاراتك (تصميم، برمجة، طائرات مسيرة، أقمار صناعية، إلكترونيات...)" required></textarea>
          </div>

          <div class="form-group full">
            <label>المسابقات أو المشاريع السابقة (إن وجدت)</label>
            <textarea id="competitions" placeholder="اذكر مشاركاتك السابقة أو اكتب (لا يوجد)"></textarea>
          </div>

          <div class="form-group full">
            <label>الصورة الشخصية (لإضافتها لملفك) *</label>
            <input type="file" id="photoInput" accept="image/*" required />
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">إرسال طلب الانضمام</button>
        <div id="formAlert" class="alert"></div>
      </form>
    </div>

    <!-- قسم لوحة القائد -->
    <div id="leaderSection" class="card hidden">
      <div id="adminLoginBox" class="admin-login">
        <h3 style="color: var(--gold); margin-bottom: 12px;">دخول قائد الفريق</h3>
        <input type="password" id="adminPassInput" placeholder="أدخل رمز المرور (FAP2026)" style="width: 100%; margin-bottom: 12px;" />
        <button class="submit-btn" style="margin-top: 0;" onclick="unlockAdmin()">دخول</button>
        <p id="loginError" style="color: #fca5a5; margin-top: 10px; font-size: 0.9rem;"></p>
      </div>

      <div id="adminPanel" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
          <h3 style="color: var(--gold); margin-bottom: 16px;">طلبات الانضمام الواردة</h3>
          <button class="btn-refresh" onclick="loadApplications()">تحديث القائمة ↻</button>
        </div>
        <div id="appsContainer">جاري تحميل الطلبات...</div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyo16RAjV3Tlx9EA-Jq8cS3P1-EnZeQlNSxOmmVtoEZIhXQQU_X4HUA6woybRcDFIhQ/exec';
    const ADMIN_PASSWORD = 'FAP2026';

    function switchTab(tab) {
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      document.getElementById('tabLeader').classList.toggle('active', tab === 'leader');
      document.getElementById('registerSection').classList.toggle('hidden', tab !== 'register');
      document.getElementById('leaderSection').classList.toggle('hidden', tab !== 'leader');
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('fapForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('formAlert');
      alertBox.className = 'alert';
      alertBox.textContent = '';

      const photoFile = document.getElementById('photoInput').files[0];
      if (!photoFile) return;

      btn.disabled = true;
      btn.textContent = 'جاري رفع البيانات والصورة... يرجى الانتظار';

      try {
        const photoBase64 = await fileToBase64(photoFile);
        const payload = {
          action: 'submit_application',
          fullName: document.getElementById('fullName').value.trim(),
          age: document.getElementById('age').value.trim(),
          governorate: document.getElementById('governorate').value.trim(),
          university: document.getElementById('university').value.trim(),
          email: document.getElementById('email').value.trim(),
          skills: document.getElementById('skills').value.trim(),
          competitions: document.getElementById('competitions').value.trim(),
          photoBase64: photoBase64
        };

        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          alertBox.className = 'alert success';
          alertBox.textContent = 'تم إرسال طلبك بنجاح! رقم طلبك: ' + result.memberId + '. ستصلك بطاقة العضوية على بريدك الإلكتروني فور الموافقة.';
          document.getElementById('fapForm').reset();
        } else {
          throw new Error(result.error || 'حدث خطأ أثناء الإرسال');
        }
      } catch (err) {
        alertBox.className = 'alert error';
        alertBox.textContent = 'تعذر إرسال الطلب: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'إرسال طلب الانضمام';
      }
    });

    function unlockAdmin() {
      const pass = document.getElementById('adminPassInput').value;
      if (pass === ADMIN_PASSWORD) {
        document.getElementById('adminLoginBox').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadApplications();
      } else {
        document.getElementById('loginError').textContent = 'رمز المرور غير صحيح!';
      }
    }

    async function loadApplications() {
      const container = document.getElementById('appsContainer');
      container.innerHTML = 'جاري جلب الطلبات من قاعدة البيانات...';

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'get_applications' })
        });
        const result = await res.json();

        if (!result.success) throw new Error(result.error || 'فشل الجلب');

        if (!result.applications || result.applications.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted);">لا توجد طلبات مسجلة حالياً.</p>';
          return;
        }

        container.innerHTML = result.applications.reverse().map(app => `
          <div class="app-item">
            <div class="app-header">
              <div>
                <strong style="font-size: 1.05rem; color: var(--gold);">${app.fullName}</strong>
                <span style="font-size: 0.85rem; color: var(--text-muted);"> (${app.memberId})</span>
              </div>
              <span class="status-pill status-${app.status}">${app.status}</span>
            </div>
            <div class="app-details">
              <div><strong>العمر:</strong> ${app.age} | <strong>المحافظة:</strong> ${app.governorate}</div>
              <div><strong>الجامعة:</strong> ${app.university}</div>
              <div><strong>البريد:</strong> ${app.email}</div>
              <div><strong>المهارات:</strong> ${app.skills}</div>
              <div><strong>المسابقات:</strong> ${app.competitions || 'لا يوجد'}</div>
              ${app.photoUrl ? `<div><a href="${app.photoUrl}" target="_blank" style="color: var(--gold);">عرض الصورة الشخصية ↗</a></div>` : ''}
            </div>
            <div class="app-actions">
              <button class="btn-approve" onclick="updateMember(${app.rowIndex}, 'approve_member', this)">موافقة وإرسال البطاقة ✓</button>
              <button class="btn-reject" onclick="updateMember(${app.rowIndex}, 'reject_member', this)">رفض ✕</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p style="color: #fca5a5;">خطأ في تحميل الطلبات: ${err.message}</p>`;
      }
    }

    async function updateMember(rowIndex, action, btn) {
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'جاري التنفيذ...';

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: action, rowIndex: rowIndex })
        });
        const result = await res.json();
        if (result.success) {
          alert(action === 'approve_member' ? 'تمت الموافقة وإرسال بطاقة PDF للعضو بنجاح!' : 'تم رفض الطلب.');
          loadApplications();
        } else {
          throw new Error(result.error || 'فشل التحديث');
        }
      } catch (err) {
        alert('حدث خطأ: ' + err.message);
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }
  </script>
</body>
</html>
