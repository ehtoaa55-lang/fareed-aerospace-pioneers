<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fareed Aerospace Pioneers - FAP</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b132b;
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background: linear-gradient(135deg, #1c2541, #0b132b);
            padding: 40px 20px;
            border-bottom: 3px solid #ffb703;
        }
        .logo-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffb703;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ffb703;
            margin: 10px 0;
            font-size: 2.2rem;
        }
        p.subtitle {
            color: #8ecae6;
            font-size: 1.1rem;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }
        .leadership-section {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background-color: #1c2541;
            border: 2px solid #3a506b;
            border-radius: 12px;
            padding: 20px;
            width: 250px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .card h3 {
            color: #ffb703;
            margin-bottom: 5px;
        }
        .card p {
            color: #adb5bd;
            font-size: 0.95rem;
        }
        .btn {
            display: inline-block;
            margin-top: 40px;
            background-color: #ffb703;
            color: #0b132b;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #fb8500;
            color: white;
        }
        footer {
            margin-top: 50px;
            padding: 20px;
            background-color: #060919;
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <!-- شعار الفريق -->
        <img src="logo.png" alt="FAP Logo" class="logo-img">
        
        <h1>Fareed Aerospace Pioneers (FAP)</h1>
        <p class="subtitle">رواد كابتن فريد للفضاء والطيران - العراق 2026</p>
    </header>

    <div class="container">
        <h2>قيادة وإدارة الفريق</h2>
        <div class="leadership-section">
            <div class="card">
                <h3>كابتن فريد</h3>
                <p>مؤسس الفريق</p>
            </div>
            <div class="card">
                <h3>د. عدي</h3>
                <p>المشرف المسؤول</p>
            </div>
            <div class="card">
                <h3>حيدر حسن</h3>
                <p>قائد الفريق</p>
            </div>
        </div>

        <br>
        <a href="#" class="btn">رابط التسجيل (قريباً)</a>
    </div>

    <footer>
        <p>&copy; 2026 FAP Team. جميع الحقوق محفوظة.</p>
    </footer>

</body>
</html>
